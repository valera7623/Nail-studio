# Автодеплой: GitHub Actions → GHCR → VPS 185.106.95.16
# Репозиторий: valera7623/Eyelash-studio
#
# Secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST       — 185.106.95.16
#   VPS_USERNAME   — valera
#   VPS_SSH_KEY    — приватный ключ (github_actions_deploy), публичный уже в authorized_keys
#   VPS_PORT       — опционально, по умолчанию 22
#   BOT_TOKEN      — токен @nailstudiobot (первый .env на VPS, потом не перезаписывается)
#
# Образ: ghcr.io/valera7623/nail-studio
# На этом VPS: studio-book :8088 / Redis :6379, eyelash-studio :8089 / :6380.
# Nail-book: HTTP :8090, Redis :6381.

name: Deploy nail-studio to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nail-studio-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/valera7623/nail-studio
  DEPLOY_DIR: /home/valera/nail-studio

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ensure deploy directory on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: mkdir -p ${{ env.DEPLOY_DIR }}/data

      - name: Copy docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: docker-compose.prod.yml
          target: ${{ env.DEPLOY_DIR }}/

      - name: Copy Traefik nail.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: deploy/traefik.yml
          target: ${{ env.DEPLOY_DIR }}/

      - name: Pull image and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE_NAME }}:latest
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 10m
          envs: GHCR_TOKEN,IMAGE,DEPLOY_DIR,BOT_TOKEN
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u valera7623 --password-stdin
            cd "$DEPLOY_DIR"
            touch .env
            chmod 600 .env
            if ! grep -q '^BOT_TOKEN=.\+' .env; then
              if [ -z "${BOT_TOKEN:-}" ]; then
                echo "Нет BOT_TOKEN в .env на VPS и нет секрета BOT_TOKEN в репозитории."
                exit 1
              fi
              umask 077
              {
                printf 'BOT_TOKEN=%s\n' "$BOT_TOKEN"
                printf 'BOT_USERNAME=nailstudiobot\n'
                printf 'ADMINS=[772208133]\n'
                printf 'SUPERADMINS=[772208133]\n'
                printf 'HTTP_PORT=8090\n'
                printf 'USE_REDIS=true\n'
                printf 'REDIS_URL=redis://127.0.0.1:6381/0\n'
                printf 'SQLITE_PATH=/app/data/nail.db\n'
                printf 'PUBLIC_BASE_URL=https://nailbook.ru\n'
              } > .env
              chmod 600 .env
            fi
            if ! grep -q '^PUBLIC_BASE_URL=' .env; then
              printf '\nPUBLIC_BASE_URL=https://nailbook.ru\n' >> .env
            fi
            mkdir -p "$DEPLOY_DIR/data/backups"
            chmod u+rwX "$DEPLOY_DIR/data" 2>/dev/null || true
            if [ -f "$DEPLOY_DIR/data/nail.db" ]; then
              chmod u+rw "$DEPLOY_DIR/data/nail.db" 2>/dev/null || true
            fi
            mkdir -p /home/valera/traefik/dynamic
            if [ -f "$DEPLOY_DIR/deploy/traefik.yml" ]; then
              cp -f "$DEPLOY_DIR/deploy/traefik.yml" /home/valera/traefik/dynamic/nail.yml || true
            fi
            if grep -q '^DOCKER_IMAGE=' .env; then
              sed -i "s|^DOCKER_IMAGE=.*|DOCKER_IMAGE=${IMAGE}|" .env
            else
              printf '\nDOCKER_IMAGE=%s\n' "$IMAGE" >> .env
            fi
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate --no-build
            docker logout ghcr.io || true
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail 20
